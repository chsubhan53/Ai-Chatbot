<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111827;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 95%;
            max-width: 500px;
            height: 650px;
            background: #1f2937;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.4;
        }

        .bot {
            background: #374151;
            color: white;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #111827;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            outline: none;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        🤖 My AI Chatbot
    </div>

    <div id="messages">
        <div class="message bot">
            Hello! 👋 Main tumhara AI chatbot hoon.
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<script>
function sendMessage() {

    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (text === "") return;

    // User message
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;

    messages.appendChild(userMessage);

    input.value = "";

    // Temporary bot reply
    setTimeout(() => {

        const botMessage = document.createElement("div");
        botMessage.className = "message bot";

        botMessage.textContent =
            "🤖 AI reply yahan aayega...";

        messages.appendChild(botMessage);

        messages.scrollTop = messages.scrollHeight;

    }, 500);
}
</script>

</body>
</html>
