
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#f8fafc;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:15px
}
.app{
  width:100%;
  max-width:760px;
  height:90vh;
  min-height:500px;
  background:#111c32;
  border:1px solid #293750;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  overflow:hidden
}
header{
  padding:18px;
  background:#172640;
  display:flex;
  justify-content:space-between;
  align-items:center
}
h1{font-size:20px;margin:0}
.status{font-size:12px;color:#86efac;margin-top:5px}
button{cursor:pointer;border:0;font-weight:bold}
#clear{
  padding:10px;
  border-radius:9px;
  color:white;
  background:#293750
}
#messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px
}
.welcome{
  margin:auto;
  text-align:center;
  line-height:1.6;
  color:#cbd5e1
}
.message{
  max-width:85%;
  padding:13px 15px;
  border-radius:14px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.user{
  align-self:flex-end;
  background:#4f46e5;
  color:white
}
.bot{
  align-self:flex-start;
  background:#23324b
}
#typing{padding:0 20px 10px;color:#94a3b8}
.composer{
  padding:15px;
  background:#172640
}
form{display:flex;gap:10px}
textarea{
  flex:1;
  min-width:0;
  height:52px;
  padding:15px;
  resize:none;
  border-radius:12px;
  background:#0f172a;
  border:1px solid #35445e;
  color:white;
  font-size:15px
}
#send{
  padding:0 18px;
  border-radius:12px;
  background:#4f46e5;
  color:white
}
#send:disabled{opacity:.5}
.note{
  text-align:center;
  font-size:11px;
  color:#94a3b8;
  margin-top:10px
}
@media(max-width:500px){
  body{padding:0}
  .app{height:100vh;min-height:0;border-radius:0}
  .message{max-width:94%}
}
</style>
</head>

<body>
<main class="app">
<header>
  <div>
    <h1>🤖 My AI Assistant</h1>
    <div class="status">● Gemini AI</div>
  </div>
  <button id="clear" type="button">Clear Chat</button>
</header>

<section id="messages" aria-live="polite">
  <div class="welcome" id="welcome">
    <h2>How can I help you?</h2>
    <p>Ask me anything!</p>
  </div>
</section>

<div id="typing" hidden>AI is thinking...</div>

<div class="composer">
  <form id="chatForm">
    <textarea id="prompt" maxlength="4000"
      placeholder="Type your message..." required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="note">AI can make mistakes. Verify important information.</div>
</div>
</main>

<script>
const API_URL =
  "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const messages = document.getElementById("messages");
const promptBox = document.getElementById("prompt");
const form = document.getElementById("chatForm");
const sendButton = document.getElementById("send");
const typing = document.getElementById("typing");

let history = [];
let busy = false;

function addMessage(text, role) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const bubble = document.createElement("div");
  bubble.className = "message " + role;
  bubble.textContent = text;
  messages.appendChild(bubble);
  messages.scrollTop = messages.scrollHeight;
}

function askAI(message) {
  return new Promise((resolve, reject) => {
    const callback = "gemini_" + Date.now() +
      "_" + Math.random().toString(36).slice(2);

    const script = document.createElement("script");
    let done = false;
    let timer;

    function finish(error, result) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      script.remove();
      delete window[callback];

      if (error) reject(error);
      else resolve(result);
    }

    window[callback] = result => finish(null, result);

    const params = new URLSearchParams({
      callback: callback,
      message: message,
      history: JSON.stringify(history.slice(-8))
    });

    script.onerror = () => finish(
      new Error("Connection failed. URL aur deployment check karo.")
    );

    timer = setTimeout(() => finish(
      new Error("Request timeout. Dobara try karo.")
    ), 60000);

    script.src = API_URL + "?" + params.toString();
    document.head.appendChild(script);
  });
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  const message = promptBox.value.trim();
  if (!message || busy) return;

  if (API_URL.includes("PASTE_YOUR") ||
      !API_URL.startsWith("https://script.google.com/")) {
    addMessage("Pehle apna Apps Script /exec URL add karo.", "bot");
    return;
  }

  busy = true;
  sendButton.disabled = true;
  typing.hidden = false;
  addMessage(message, "user");
  promptBox.value = "";

  try {
    const result = await askAI(message);

    if (result.error) throw new Error(result.error);
    if (!result.reply) throw new Error("AI reply nahi mila.");

    addMessage(result.reply, "bot");

    history.push(
      {role:"user", text:message},
      {role:"model", text:result.reply}
    );
    history = history.slice(-8);

  } catch (error) {
    addMessage("Error: " + error.message, "bot");
  } finally {
    busy = false;
    sendButton.disabled = false;
    typing.hidden = true;
    promptBox.focus();
  }
});

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

document.getElementById("clear").addEventListener("click", () => {
  if (busy) return;
  history = [];
  messages.replaceChildren();

  const welcome = document.createElement("div");
  welcome.id = "welcome";
  welcome.className = "welcome";

  const title = document.createElement("h2");
  title.textContent = "How can I help you?";

  const description = document.createElement("p");
  description.textContent = "Ask me anything!";

  welcome.append(title, description);
  messages.appendChild(welcome);
});
</script>
</body>
</html>
